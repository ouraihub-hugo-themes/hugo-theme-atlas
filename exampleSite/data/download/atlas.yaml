# 下载区的数据。版本号、仓库、tag 都是事实，只能写在这里 —— 允许在 shortcode
# 上覆盖，同一页上就可能出现两个互相矛盾的版本号。
#
# tag 缺省是 v 加版本号。published: false 时只置灰 pinned 渠道。
version: "0.1.0"
repo: ouraihub-hugo-themes/hugo-theme-atlas

channels:
  # rolling：跟着最新走，所以不许插值 —— 往"装最新版"的命令里写死一个版本号
  # 是自相矛盾的。
  - id: module
    kind: rolling
    title: Hugo Module
    title_zh_cn: Hugo 模块
    icon: box
    note: 推荐这一种。Hugo 自己管版本，`hugo mod get -u` 就是升级。
    steps:
      - title: 在 hugo.toml 里声明
        lang: toml
        code: |
          [module]
          [[module.imports]]
          path = "github.com/ouraihub-hugo-themes/hugo-theme-atlas"
      - title: 拉取
        lang: shell
        code: hugo mod get -u github.com/ouraihub-hugo-themes/hugo-theme-atlas

  # pinned：指向一个具体版本，所以 ${version} 与 ${tag} 可用。
  - id: tarball
    kind: pinned
    title: Source tarball
    title_zh_cn: 源码归档
    icon: file-zipper
    note: 不想让 Hugo 管模块时用这个。解到 `themes/` 下即可。
    url: https://github.com/ouraihub-hugo-themes/hugo-theme-atlas/archive/refs/tags/${tag}.tar.gz
    steps:
      - lang: shell
        code: |
          curl -fsSL -o atlas.tar.gz \
            https://github.com/ouraihub-hugo-themes/hugo-theme-atlas/archive/refs/tags/${tag}.tar.gz
          tar -xzf atlas.tar.gz -C themes/
    # 校验和只有 pinned 渠道能有 —— rolling 不指向具体版本，一组校验和挂在它
    # 下面就是错的。这里指向 assets 里的文件，与写在 checksums 里等价。
    checksums_src: snippets/checksums.txt

  - id: source
    kind: rolling
    title: Build from source
    title_zh_cn: 从源码构建
    icon: code-branch
    note: 要改主题本身时走这条。需要 Node 与 pnpm。
    steps:
      - lang: shell
        code: |
          git clone https://github.com/ouraihub-hugo-themes/hugo-theme-atlas
          cd hugo-theme-atlas
          pnpm install
          pnpm build
