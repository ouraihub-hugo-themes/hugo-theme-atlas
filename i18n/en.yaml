code_copy: Copy code
code_copied: Copied
code_collapse: Collapse
# 带 Count 的字符串要走复数形式，否则 1 行的代码块会读作 "Show all 1 lines"。
code_expand:
  one: Show all {{ .Count }} line
  other: Show all {{ .Count }} lines

# tablist 的可访问名字。作者可以用 tabs 的 label 参数覆盖它 —— 一页上有多组
# 标签页时，屏幕阅读器只报 "Tabs" 分不清哪一组。
tabs_label: Tabs

# 按键序列里 `+` 的可读版本。屏幕阅读器把 "Ctrl + K" 读成 "Ctrl 加号 K"
# 是符号，不是意思 —— 这个词代替它。
kbd_with: with

# 交叉引用目标的标签词。四个键各自独立，不拼字符串 —— 语言之间的词序不同
# （英文 "Figure 3"，中文"图 3"）。
book_figure: Figure
book_table: Table
book_equation: Equation
book_example: Example

# 列表的可访问名字。作者可以用 title 参数覆盖 —— 一页上同时有图表目录与表格
# 目录时，屏幕阅读器的地标列表里两个都叫 "navigation" 就没法选。
book_toc: Contents
book_fig_list: List of figures
book_tbl_list: List of tables
book_eq_list: List of equations
book_eg_list: List of examples

# 字段表。required 与 default 是 API 词汇，各语言里通常照搬英文，但仍走 i18n
# —— 决定要不要译是译者的事，不是模板的事。
field_required: required
field_default: default
field_self_link: Link to this field

# 头像墙的计数。数字由模板单独渲染（它有自己的字号），这里只有名词，所以
# 单复数要分开 —— "1 contributors" 在英文里是错的。
contributors_count:
  one: contributor
  other: contributors

# 资产表。assets_download 同时做表格的可访问名字与 caption，所以是一个名词
# 短语而不是一句祈使句 —— 屏幕阅读器会把它当"这个区域叫什么"来读。
assets_download: Download
assets_file: File
assets_checksum: Checksum
assets_copy: Copy checksum
assets_copy_all: Copy all
assets_copied: Copied

# 发布卡片。release_released 是一个形容词短语（"released 2026-08-25"），
# release_links 是那组链接的可访问名字 —— 两者不能共用一个键：卡片自己的名字
# 用版本号（tag 就是最准确的标题），而里面那层 nav 需要自己的名字。
release_view: View release
release_source: Source
release_released: Released
release_links: Release links

# 下载区。download_unpublished 是一个状态而不是一句道歉："版本号定了但资产还
# 没上传"是发布流程里的正常一段，读者需要知道的是等，不是出错了。
download_channels: Download channels
download_unpublished: Not published yet

# 终端录屏。这条在播放器挂上之前一直可见，是 JS 没跑时唯一的出路 —— 因此说的
# 是"下载这份录屏"而不是"你的浏览器不支持"：文件本身对读者有用，asciicast 是
# 纯文本，在终端里 `asciinema play` 就能看。
cast_download: Download the terminal recording

# 能力清单的三档状态。同样是"图标装饰 + 一份朗读文本"，少了它读者只听到能力
# 名，听不出有没有。"Partial" 单独一档而不是说"部分支持"：这一节的条目不都是
# 功能，"部分"能同时描述功能、平台、格式。
capability_yes: Supported
capability_partial: Partial
capability_no: Not supported

# 价格对比表的布尔格。勾与叉是图标（装饰，读屏软件跳过），所以每个格里配一份
# sr-only 文本 —— 少了它整张表在读屏软件那里是一片空格，读者听到的是"行标题、
# 空、空、空"。用形容词而不是 "Yes"/"No"：读出来是"实时备份，包含"。
pricing_included: Included
pricing_excluded: Not included

# OpenAPI 渲染器。runtime 未配置、脚本没下下来、渲染失败三种情况下这条都可见 ——
# 因此说的是"打开这份 spec"而不是"渲染器不可用"：OpenAPI 文档是 JSON 或 YAML，
# 能 curl、能导进 Postman、能喂给代码生成器，渲染器只是让它好看。
openapi_spec_link: Open the OpenAPI specification
