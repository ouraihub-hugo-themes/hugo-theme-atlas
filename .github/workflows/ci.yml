# 主题的全套门禁。
#
# 这份的存在理由：九个检查器在这之前只在一台机器上跑过。产物提交进仓库
# （assets/dist/ 是消费方直接引用的），所以「源码改了但产物没重建」是能推上来的
# —— 而它的表现是消费方拿到的是旧样式，仓库里看起来一切正常。
#
# 两个 job 分开：
#
#   check  跑 pnpm check（格式、类型、lint、单测，加六个检查器）。它自己建站点，
#          所以要 hugo。
#   dist   证明产物与源码同步：重建一遍，然后要求 git 树干净。这条在 check 里
#          做不了 —— check 只读产物，不会发现它是旧的。
#
# 只跑开发版 0.165.0。曾经把兼容下限 0.160.1 也放进矩阵，理由是"声明一个没人验过
# 的下限等于没声明"——那条理由仍然成立，但它换来的信息量抵不上每次推送多一整轮
# 的等待：两版跑的是同一套检查器，下限专有的失败一次都没出现过。
#
# 下限没有不验，是挪到了 floor.yml：手动触发，发版前跑一次。theme.toml 的
# min_version 因此仍然是验证过的声明，只是不在每次推送的关键路径上。
#
# 每个 job 都有 timeout-minutes。没有它的时候一次卡住的构建会挂到 GitHub 默认的
# 6 小时上限 —— 这份工作流最长的一次就是这么来的，不是某一版 hugo 慢。

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: rebuild the shipped assets
        run: pnpm css:build && pnpm ts:build

      # 产物必须与源码一致。不一致说明有人改了 src/ 却没跑构建 ——
      # 而消费方拿到的是仓库里那一份。
      - name: assets/dist is up to date
        run: |
          if ! git diff --quiet -- assets/dist; then
            echo "assets/dist is stale; run 'pnpm css:build && pnpm ts:build' and commit the result" >&2
            git --no-pager diff --stat -- assets/dist >&2
            exit 1
          fi
