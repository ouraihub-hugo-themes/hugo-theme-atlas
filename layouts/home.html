{{ define "main" }}
<h1 class="font-display text-4xl font-bold text-ink-strong">{{ site.Title }}</h1>
{{ with site.Params.description }}<p class="mt-3 text-lg text-ink-muted">{{ . }}</p>{{ end }}

<div class="td-prose mt-8">{{ .Content }}</div>

<p class="mt-8">
  <button type="button" data-td-theme-toggle
          class="rounded-lg border border-border bg-elev px-4 py-2 text-sm font-medium
                 transition-colors hover:border-accent hover:text-accent">
    {{ i18n "toggle_theme" }}
  </button>
</p>

<ul class="mt-8 space-y-2">
  {{- range site.Sections -}}
    <li><a href="{{ .RelPermalink }}" class="font-medium">{{ .LinkTitle }} →</a></li>
  {{- end -}}
</ul>
{{ end }}
